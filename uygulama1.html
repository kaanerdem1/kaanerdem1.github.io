<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uygulama 1 – Öğrenci Not Hesaplama</title>
  <link rel="stylesheet" href="styles/style.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; }

    .uygulama-wrapper {
      max-width: 500px;
      margin: 40px auto;
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 8px;
      padding: 30px 35px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .uygulama-wrapper h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #2c3e50;
      font-size: 20px;
      border-bottom: 2px solid #2c3e50;
      padding-bottom: 10px;
    }

    .form-satir {
      margin-bottom: 16px;
    }

    .form-satir label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .form-satir input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      background: #fafafa;
    }

    .form-satir input[type="text"]:focus {
      outline: none;
      border-color: #2c3e50;
      background: #fff;
    }

    .btn-hesapla {
      display: block;
      width: 100%;
      padding: 11px;
      background-color: #2c3e50;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      letter-spacing: 0.5px;
    }

    .btn-hesapla:hover {
      background-color: #3d5166;
    }

    #sonuc-alani {
      display: none;
      margin-top: 22px;
      padding: 16px 18px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.8;
    }

    #sonuc-alani.gecti {
      background-color: #d4edda;
      border: 1px solid #28a745;
      color: #155724;
    }

    #sonuc-alani.kaldi {
      background-color: #f8d7da;
      border: 1px solid #dc3545;
      color: #721c24;
    }

    .sonuc-satir {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding: 3px 0;
    }

    .sonuc-satir:last-child { border-bottom: none; }

    .geri-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2c3e50;
      text-decoration: none;
      font-size: 13px;
    }
    .geri-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="uygulama-wrapper">
  <h2>📊 Öğrenci Not Hesaplama</h2>

  <div class="form-satir">
    <label for="adSoyad">Ad Soyad:</label>
    <input type="text" id="adSoyad" placeholder="Adınızı ve soyadınızı giriniz">
  </div>

  <div class="form-satir">
    <label for="vize">Vize Notu (0–100):</label>
    <input type="text" id="vize" placeholder="Vize notunuzu giriniz">
  </div>

  <div class="form-satir">
    <label for="final">Final Notu (0–100):</label>
    <input type="text" id="final" placeholder="Final notunuzu giriniz">
  </div>

  <button class="btn-hesapla" id="btnHesapla">Hesapla</button>

  <div id="sonuc-alani">
    <div class="sonuc-satir"><span>Öğrenci:</span><span id="s-ad"></span></div>
    <div class="sonuc-satir"><span>Vize (%40):</span><span id="s-vize"></span></div>
    <div class="sonuc-satir"><span>Final (%60):</span><span id="s-final"></span></div>
    <div class="sonuc-satir"><span>Ortalama:</span><strong id="s-ort"></strong></div>
    <div class="sonuc-satir"><span>Harf Notu:</span><strong id="s-harf"></strong></div>
    <div class="sonuc-satir"><span>Durum:</span><strong id="s-durum"></strong></div>
  </div>

  <a href="index.html" class="geri-link">← Ana Sayfaya Dön</a>
</div>

<script>
  document.getElementById('btnHesapla').addEventListener('click', function() {
    var adSoyad  = document.getElementById('adSoyad').value.trim();
    var vizeStr  = document.getElementById('vize').value.trim();
    var finalStr = document.getElementById('final').value.trim();

    if (adSoyad === '') { alert('Lütfen Ad Soyad giriniz.'); return; }

    var vize  = parseFloat(vizeStr);
    var final = parseFloat(finalStr);

    if (isNaN(vize)  || vize  < 0 || vize  > 100) { alert('Vize notu 0-100 arasında olmalıdır.'); return; }
    if (isNaN(final) || final < 0 || final > 100)  { alert('Final notu 0-100 arasında olmalıdır.'); return; }

    var ortalama = (vize * 0.4) + (final * 0.6);
    ortalama = Math.round(ortalama * 100) / 100;

    var harf;
    if      (ortalama >= 90) harf = 'AA';
    else if (ortalama >= 85) harf = 'BA';
    else if (ortalama >= 80) harf = 'BB';
    else if (ortalama >= 75) harf = 'CB';
    else if (ortalama >= 70) harf = 'CC';
    else if (ortalama >= 65) harf = 'DC';
    else if (ortalama >= 60) harf = 'DD';
    else if (ortalama >= 50) harf = 'FD';
    else                     harf = 'FF';

    var gecti = ortalama >= 50;

    document.getElementById('s-ad').textContent    = adSoyad;
    document.getElementById('s-vize').textContent  = vize;
    document.getElementById('s-final').textContent = final;
    document.getElementById('s-ort').textContent   = ortalama;
    document.getElementById('s-harf').textContent  = harf;
    document.getElementById('s-durum').textContent = gecti ? '✅ GEÇTİ' : '❌ KALDI';

    var alan = document.getElementById('sonuc-alani');
    alan.style.display = 'block';
    alan.className = gecti ? 'gecti' : 'kaldi';
  });
</script>

</body>
</html>
